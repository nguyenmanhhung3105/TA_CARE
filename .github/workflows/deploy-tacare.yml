name: Deploy TA.CARE

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_mode:
        description: 'Chế độ triển khai'
        type: choice
        options: [code, with-data]
        default: code
        required: true
      data_sha256:
        description: 'SHA256 của gói dữ liệu đã được duyệt trên server; chỉ dùng với with-data'
        type: string
        required: false

permissions: {}

concurrency:
  group: tacare-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Chọn chế độ triển khai
        id: selection
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_MODE: ${{ inputs.deploy_mode }}
          REQUESTED_DATA: ${{ inputs.data_sha256 }}
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          mode, data = 'code', ''
          if os.environ['EVENT_NAME'] == 'workflow_dispatch':
              mode = os.environ['REQUESTED_MODE'] or 'code'
              data = os.environ['REQUESTED_DATA'].strip()
          else:
              trailers = [line for line in os.environ['HEAD_MESSAGE'].splitlines()
                          if line.startswith('Tacare-Data-SHA256:')]
              if trailers:
                  if len(trailers) != 1:
                      raise SystemExit('Duplicate data selection in the release commit')
                  mode, data = 'with-data', trailers[0].partition(':')[2].strip()
          if mode not in ('code', 'with-data'):
              raise SystemExit('Unsupported deployment mode')
          if mode == 'with-data' and not re.fullmatch(r'[0-9a-f]{64}', data):
              raise SystemExit('with-data requires an approved bundle SHA256')
          if mode == 'code' and data:
              raise SystemExit('code mode must not select a data bundle')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'mode={mode}\ndata={data}\n')
          print('Selected deployment mode:', mode)
          PY

      - name: Kết nối server và triển khai
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          COMMIT_SHA: ${{ github.sha }}
          DEPLOY_MODE: ${{ steps.selection.outputs.mode }}
          DATA_SHA256: ${{ steps.selection.outputs.data }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077

          : "${DEPLOY_HOST:?Missing DEPLOY_HOST secret}"
          : "${DEPLOY_USER:?Missing DEPLOY_USER secret}"
          : "${DEPLOY_SSH_KEY:?Missing DEPLOY_SSH_KEY secret}"
          : "${DEPLOY_KNOWN_HOSTS:?Missing DEPLOY_KNOWN_HOSTS secret}"
          DEPLOY_PORT=${DEPLOY_PORT:-22}
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.-]{0,252}$ ]] || { echo 'Invalid deploy host'; exit 1; }
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]{0,31}$ ]] || { echo 'Invalid deploy user'; exit 1; }
          [[ "$DEPLOY_PORT" =~ ^[1-9][0-9]{0,4}$ ]] && (( 10#$DEPLOY_PORT <= 65535 )) || { echo 'Invalid SSH port'; exit 1; }

          ssh_dir=$(mktemp -d)
          trap 'rm -rf "$ssh_dir"' EXIT

          printf '%s\n' "$DEPLOY_SSH_KEY" > "$ssh_dir/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$ssh_dir/known_hosts"

          [[ "$COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]
          remote_command="sudo -n /usr/local/lib/tacare-deploy/deploy.sh $COMMIT_SHA"
          case "$DEPLOY_MODE" in
            code) [[ -z "$DATA_SHA256" ]] ;;
            with-data)
              [[ "$DATA_SHA256" =~ ^[0-9a-f]{64}$ ]]
              remote_command+=" --with-data $DATA_SHA256"
              ;;
            *) exit 1 ;;
          esac

          ssh \
            -i "$ssh_dir/key" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$ssh_dir/known_hosts" \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=6 \
            -p "$DEPLOY_PORT" \
            -l "$DEPLOY_USER" \
            "$DEPLOY_HOST" \
            "$remote_command"
