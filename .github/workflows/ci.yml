name: TA.CARE CI

on:
  pull_request:
    branches: [uat, main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static:
    name: Source and deployment checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Require UAT as the production pull request source
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        env:
          SOURCE_BRANCH: ${{ github.head_ref }}
          SOURCE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          [[ "$SOURCE_BRANCH" == uat && "$SOURCE_REPOSITORY" == "$GITHUB_REPOSITORY" ]] || {
            echo 'Production changes must first pass through this repository UAT branch.'
            exit 1
          }
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.21.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Check repository source and credentials
        run: |
          python3 tools/ci/check_static.py
          python3 tools/security/check_repository.py
      - name: Validate all workflows with pinned actionlint
        run: |
          curl --fail --silent --show-error --location \
            --output "$RUNNER_TEMP/actionlint.tar.gz" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz
          echo "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" .github/workflows/ci.yml .github/workflows/deploy-uat.yml .github/workflows/deploy-tacare.yml
      - name: Check deployment and workflow boundaries
        run: |
          python3 -m unittest discover -s tools/security -p 'test_*.py'
          python3 -m unittest discover -s tools/deploy/tests -p 'test_*.py'
          python3 -m unittest discover -s tools/ci -p 'test_*.py'
          python3 source/apps/tacare/addons/tacare_website/tests/test_geo_utils.py
          python3 source/apps/tacare/addons/tacare_website/tests/test_map_config.py
          node source/apps/tacare/addons/tacare_website/tests/nearby_lazy_check.cjs
          node source/apps/tacare/addons/tacare_website/tests/mapbox_layer_check.cjs

  odoo:
    name: Odoo install upgrade security and browser
    needs: static
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Run disposable Odoo pipeline
        env:
          CI_BASELINE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_RUNTIME: ${{ runner.temp }}/tacare-ci
        run: python3 tools/ci/run_odoo.py
      - name: Keep synthetic test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tacare-ci-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/tacare-ci/reports/
          if-no-files-found: warn
          retention-days: 3
